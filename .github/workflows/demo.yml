# Builds the interactive demo (the C++ core compiled to WebAssembly, inside
# the dashboard) and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 3.1.58 # the first release whose libc++ has std::jthread

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the simulator (WebAssembly)
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake --preset wasm
          cmake --build --preset wasm

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Smoke-test the simulator
        run: node demo/smoke.mjs build/wasm/demo/matchmesh-sim.mjs

      - name: Test and build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npx ng test --watch=false
          mkdir -p public/sim
          cp ../build/wasm/demo/matchmesh-sim.mjs public/sim/
          npm run build:demo

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
