# Serves the built dashboard, and forwards the gateway's endpoints so the
# browser talks to one address (no cross-origin setup needed).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS; looking the gateway up per request (via the variable)
    # means nginx starts even if the gateway isn't up yet.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:8081;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The WebSocket: HTTP/1.1 plus the Upgrade headers turn the request into
    # a long-lived connection; the long read timeout keeps a quiet one open.
    location /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $gateway;
    }
}
