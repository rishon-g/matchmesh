// Node-to-node API: failure detection, replication and topology.
syntax = "proto3";

package matchmesh.v1;

import "google/protobuf/timestamp.proto";
import "matchmesh/v1/common.proto";

service ClusterService {
  // "I'm alive, and here is the membership view I hold." Sent to every peer
  // every 500 ms; a peer silent for 1.5 s is suspected dead. Also used as a
  // basic ping by the smoke test and the Docker health check.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Primary -> backup: apply one queue change, or replace the backup's copy
  // with a full snapshot. The primary waits for the backup to accept before
  // applying the change itself or answering the player, so an acknowledged
  // change survives the primary crashing. Also used to hand a whole queue to
  // its new owner after a membership change.
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);

  // Snapshot of the cluster: who is alive, who owns which queue, and recent
  // lobbies. The WebSocket gateway polls this for the dashboard.
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
}

// ---- Heartbeat ----

// Heartbeats double as the way membership views spread: each side sends the
// view (epoch + members) it currently holds, and whoever's is older adopts
// the newer one. Only the coordinator ever creates a new view.
//
// Request and response carry the same information about their sender.

message HeartbeatRequest {
  string node_id = 1;
  // The sender's current membership view: its epoch, sorted members, and
  // the incarnation each member had when the view was published.
  uint64 epoch = 2;
  repeated string members = 3;
  map<string, uint64> incarnations = 4;
  // Random number the sender picked when its process started. A new one
  // means it restarted (and lost its memory), even if nobody noticed it go.
  uint64 incarnation = 5;
  // The latest epoch for which the sender has finished handing every queue
  // it holds to that queue's owner. A queue's new owner starts serving only
  // once every member reports the current epoch here. Unset until the
  // sender has finished for any epoch.
  optional uint64 synced_epoch = 6;
}

message HeartbeatResponse {
  string node_id = 1;
  uint64 epoch = 2;
  repeated string members = 3;
  map<string, uint64> incarnations = 4;
  uint64 incarnation = 5;
  optional uint64 synced_epoch = 6;
}

// ---- Replicate ----

// A player joined the queue.
message EnqueueOp {
  Player player = 1;
  google.protobuf.Timestamp enqueued_at = 2;  // so the copy keeps their wait time
}

// A player left the queue.
message CancelOp {
  string player_id = 1;
}

// A lobby formed. Replicated as one step so a failover halfway through can't
// leave some of its players queued and others in the lobby.
message LobbyFormedOp {
  Lobby lobby = 1;
}

// A player waiting in a queue, for snapshots.
message WaitingPlayer {
  Player player = 1;
  google.protobuf.Timestamp enqueued_at = 2;
}

// A complete copy of one queue: everyone waiting and every lobby it formed.
// Sent when a backup is new or may have missed changes, and to hand a queue
// to its new owner. ReplicateRequest.sequence is the last change it includes.
message ShardSnapshot {
  repeated WaitingPlayer waiting = 1;  // in arrival order
  repeated Lobby lobbies = 2;
  map<string, string> lobby_of = 3;    // player ID -> lobby ID
}

message ReplicateRequest {
  // Who sent it: the queue's primary, or (for a snapshot handed to a new
  // owner) any node that held a copy.
  string sender_node_id = 1;

  // The membership epoch the sender is acting under. A receiver at any other
  // epoch rejects the request, so a stale node that no longer owns the shard
  // can't overwrite newer state.
  uint64 epoch = 2;

  QueueKey queue = 3;  // which shard this change belongs to

  // Per-shard counter, +1 per change. A backup applies a change only if it
  // is exactly the next one; anything else is rejected and the primary
  // sends a full snapshot instead. For a snapshot: the last change in it.
  uint64 sequence = 4;

  oneof op {
    EnqueueOp enqueue = 5;
    CancelOp cancel = 6;
    LobbyFormedOp lobby_formed = 7;
    ShardSnapshot snapshot = 8;
  }
}

message ReplicateResponse {
  bool accepted = 1;
  uint64 epoch = 2;    // the receiver's epoch, so a stale sender learns it is stale
  string reason = 3;   // why it was rejected (for logs and tests)
}

// ---- GetTopology ----

message GetTopologyRequest {}

message NodeStatus {
  string node_id = 1;
  string address = 2;  // host:port of its gRPC server
  bool alive = 3;
}

message ShardAssignment {
  QueueKey queue = 1;
  string primary_node_id = 2;
  string backup_node_id = 3;  // next distinct node clockwise on the ring
  uint32 queued_players = 4;
}

// shards and recent_lobbies are filled in with the dashboard (Phase 7); for
// now GetTopology reports the membership view and each node's status.
message GetTopologyResponse {
  uint64 epoch = 1;
  string coordinator_node_id = 2;  // the alive node with the lowest ID
  repeated NodeStatus nodes = 3;
  repeated ShardAssignment shards = 4;
  repeated Lobby recent_lobbies = 5;  // feed for the dashboard
}
